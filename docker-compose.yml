services:
  nginx:
    image: nginx:alpine
    container_name: pm_nginx
    restart: unless-stopped
    ports:
      - "8082:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - /var/www:/var/www/host_projects:ro
    depends_on:
      - php
    networks:
      - pm_network
      - proxy
    # Traefik muda por máquina. Os padrões valem para a máquina pessoal
    # (traefik-net, http://pm.local). Na infra da Helloo, defina no .env:
    #   PM_TRAEFIK_NETWORK=local_helloo
    #   PM_HOST=local-pm.helloo.com.br
    #   PM_ENTRYPOINT=websecure
    #   PM_TLS=true
    labels:
      - "traefik.enable=true"
      # pm_nginx está em duas redes; sem isto o Traefik pode escolher o IP da
      # pm_network, que ele não alcança (504).
      - "traefik.docker.network=${PM_TRAEFIK_NETWORK:-traefik-net}"
      - "traefik.http.routers.pm.rule=Host(`${PM_HOST:-pm.local}`)"
      - "traefik.http.routers.pm.entrypoints=${PM_ENTRYPOINT:-web}"
      - "traefik.http.routers.pm.tls=${PM_TLS:-false}"
      - "traefik.http.services.pm.loadbalancer.server.port=80"

  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pm_php
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - /var/www:/var/www/host_projects:ro
    networks:
      - pm_network

  queue-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pm_queue_worker
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work --sleep=3 --tries=3 --max-jobs=100
    volumes:
      - ./:/var/www
    depends_on:
      - ollama
      - qdrant
    networks:
      - pm_network

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pm_scheduler
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan schedule:work
    volumes:
      - ./:/var/www
    depends_on:
      - qdrant
      - ollama
    networks:
      - pm_network

  # Instância única de Ollama da máquina, adotada deste compose: o Obsidian fala
  # com ela pela porta publicada em 127.0.0.1 e este projeto pelo nome `ollama` na
  # pm_network. Uma NVIDIA MX230 de 2GB não comporta duas instâncias disputando VRAM.
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    devices:
      - "nvidia.com/gpu=all"
    ports:
      - "127.0.0.1:11434:11434"
    environment:
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_KV_CACHE_TYPE=q8_0
      # Compartilhado com o obsidian-rag-agent: janela de sessão, não -1/
      # infinito — os dois apps não podem manter os modelos residentes
      # indefinidamente nos 7.6GB do host sem risco de OOM/swap.
      - OLLAMA_KEEP_ALIVE=15m
    volumes:
      - ollama:/root/.ollama
    networks:
      - pm_network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: pm_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - pm_network

networks:
  pm_network:
    driver: bridge
  # Rede do Traefik, criada fora deste compose. Na máquina pessoal é a traefik-net
  # (/var/www/traefik); na infra da Helloo é a local_helloo (projeto "local").
  proxy:
    external: true
    name: ${PM_TRAEFIK_NETWORK:-traefik-net}

volumes:
  # Volume do Ollama que já existia na máquina (llama3.2 do Obsidian + bge-m3 daqui).
  # Externo de propósito: os modelos não pertencem a este projeto, e um `down -v`
  # aqui não pode levá-los embora.
  ollama:
    external: true
    name: gerenciador_projetos_ollama_data
  qdrant_data:
